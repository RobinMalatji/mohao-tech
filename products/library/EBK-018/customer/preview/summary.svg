<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <rect width="1200" height="750" fill="#f4f3ef"/>
  <rect x="28" y="24" width="1144" height="702" rx="18" fill="#ffffff" stroke="#e6e4de"/>
  <text x="64" y="78" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#0b0b0b">A brand voice page</text>
  <text x="64" y="118" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#5f5e58">One page that tells a writer what you sound like, with examples.</text>
  <text x="64" y="176" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0b0b0b">Three lines</text>
  <circle cx="72" cy="203" r="4" fill="#ff6a1a"/>
  <text x="88" y="208" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2c2c2a">The reader.</text>
  <circle cx="72" cy="231" r="4" fill="#ff6a1a"/>
  <text x="88" y="236" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2c2c2a">Claims you refuse.</text>
  <circle cx="72" cy="259" r="4" fill="#ff6a1a"/>
  <text x="88" y="264" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2c2c2a">One true sentence.</text>
  <text x="64" y="308" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0b0b0b">Examples</text>
  <circle cx="72" cy="335" r="4" fill="#ff6a1a"/>
  <text x="88" y="340" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2c2c2a">Five befores and afters.</text>
  <circle cx="72" cy="363" r="4" fill="#ff6a1a"/>
  <text x="88" y="368" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2c2c2a">Taken from real sentences.</text>
  <circle cx="72" cy="391" r="4" fill="#ff6a1a"/>
  <text x="88" y="396" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2c2c2a">No word list of fifty adjectives.</text>
  <text x="64" y="440" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0b0b0b">Words you avoid</text>
  <circle cx="72" cy="467" r="4" fill="#ff6a1a"/>
  <text x="88" y="472" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2c2c2a">A short avoid list.</text>
  <circle cx="72" cy="495" r="4" fill="#ff6a1a"/>
  <text x="88" y="500" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2c2c2a">Words your customers do use.</text>
  <circle cx="72" cy="523" r="4" fill="#ff6a1a"/>
  <text x="88" y="528" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2c2c2a">No thesaurus exercise.</text>
  <text x="64" y="572" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0b0b0b">Use it</text>
  <circle cx="72" cy="599" r="4" fill="#ff6a1a"/>
  <text x="88" y="604" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2c2c2a">Next to the writing.</text>
  <circle cx="72" cy="627" r="4" fill="#ff6a1a"/>
  <text x="88" y="632" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2c2c2a">One email a month.</text>
  <circle cx="72" cy="655" r="4" fill="#ff6a1a"/>
  <text x="88" y="660" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2c2c2a">Update an example when you find a better one.</text>
</svg>
