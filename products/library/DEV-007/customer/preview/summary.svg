<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <rect width="1200" height="750" fill="#f4f3ef"/>
  <rect x="28" y="24" width="1144" height="702" rx="18" fill="#ffffff" stroke="#e6e4de"/>
  <text x="64" y="72" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#0b0b0b">page.mjs</text>
  <rect x="64" y="96" width="1072" height="560" rx="12" fill="#161616"/>
  <text x="88" y="136" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#f4f3ef">export function pageWindow(page, pageSize, maxPageSize = 50) {</text>
  <text x="88" y="168" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#f4f3ef">const current = Number(page);</text>
  <text x="88" y="200" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#f4f3ef">const size = Number(pageSize);</text>
  <text x="88" y="232" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#f4f3ef">if (!Number.isInteger(current) || current &lt; 1) throw new Error(&quot;Page must be…</text>
  <text x="88" y="264" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#f4f3ef">if (!Number.isInteger(size) || size &lt; 1) throw new Error(&quot;Page size must be a…</text>
  <text x="88" y="296" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#f4f3ef">const limit = Math.min(size, maxPageSize);</text>
  <text x="88" y="328" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#f4f3ef">return { page: current, limit, offset: (current - 1) * limit };</text>
  <text x="88" y="360" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#f4f3ef">}</text>
  <text x="88" y="392" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#f4f3ef"></text>
</svg>
