  <text x="64" y="224" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0b0b0b">A late invoice process · Sample firm · 2025</text>
  <circle cx="72" cy="251" r="4" fill="#ff6a1a"/>
  <text x="88" y="256" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2c2c2a">Situation: invoices older than 45 days.</text>
  <circle cx="72" cy="279" r="4" fill="#ff6a1a"/>
  <text x="88" y="284" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2c2c2a">Action: a Friday list and one owner.</text>
  <circle cx="72" cy="307" r="4" fill="#ff6a1a"/>
  <text x="88" y="312" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2c2c2a">Result: the count fell. You must insert your real count.</text>
