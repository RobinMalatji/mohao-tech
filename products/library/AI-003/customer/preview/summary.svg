  <text x="88" y="312" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2c2c2a">Use when: The buyer expected a different format.</text>
  <circle cx="72" cy="335" r="4" fill="#ff6a1a"/>
  <text x="88" y="340" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2c2c2a">Draft a reply that restates the formats listed in the product and offers to check the…</text>
  <text x="64" y="384" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0b0b0b">Refund request</text>
  <circle cx="72" cy="411" r="4" fill="#ff6a1a"/>
  <text x="88" y="416" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2c2c2a">Use when: Someone wants money back.</text>
