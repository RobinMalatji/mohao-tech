<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <rect width="1200" height="750" fill="#f4f3ef"/>
  <rect x="28" y="24" width="1144" height="702" rx="18" fill="#ffffff" stroke="#e6e4de"/>
  <text x="64" y="72" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#0b0b0b">password.mjs</text>
  <rect x="64" y="96" width="1072" height="560" rx="12" fill="#161616"/>
  <text x="88" y="136" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#f4f3ef">const common = new Set([&quot;password1234&quot;, &quot;changeme123&quot;, &quot;qwertyuiop12&quot;]);</text>
  <text x="88" y="168" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#f4f3ef"></text>
  <text x="88" y="200" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#f4f3ef">export function passwordProblems(password) {</text>
  <text x="88" y="232" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#f4f3ef">const value = String(password);</text>
  <text x="88" y="264" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#f4f3ef">const problems = [];</text>
  <text x="88" y="296" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#f4f3ef">if (value.length &lt; 12) problems.push(&quot;Use at least 12 characters.&quot;);</text>
  <text x="88" y="328" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#f4f3ef">if (!/[A-Za-z]/.test(value) || !/[0-9]/.test(value)) problems.push(&quot;Use both…</text>
  <text x="88" y="360" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#f4f3ef">if (common.has(value.toLowerCase())) problems.push(&quot;Choose a password that is…</text>
  <text x="88" y="392" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#f4f3ef">return problems;</text>
  <text x="88" y="424" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#f4f3ef">}</text>
  <text x="88" y="456" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#f4f3ef"></text>
</svg>
