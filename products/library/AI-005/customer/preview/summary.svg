<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <rect width="1200" height="750" fill="#f4f3ef"/>
  <rect x="28" y="24" width="1144" height="702" rx="18" fill="#ffffff" stroke="#e6e4de"/>
  <text x="64" y="78" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#0b0b0b">Code review prompts</text>
  <text x="64" y="118" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#5f5e58">These prompts draft text for you to edit. They do not check facts, quotes, or</text>
  <text x="64" y="142" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#5f5e58">the law. Remove anything the model invented before you send it.</text>
  <text x="64" y="176" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0b0b0b">Behaviour first</text>
  <circle cx="72" cy="203" r="4" fill="#ff6a1a"/>
  <text x="88" y="208" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2c2c2a">Use when: You have a diff.</text>
  <circle cx="72" cy="231" r="4" fill="#ff6a1a"/>
  <text x="88" y="236" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2c2c2a">List behaviour changes in this diff. Quote the lines. Do not style-nit. If you are un…</text>
  <text x="64" y="280" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0b0b0b">Missing test</text>
  <circle cx="72" cy="307" r="4" fill="#ff6a1a"/>
  <text x="88" y="312" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2c2c2a">Use when: Tests exist.</text>
  <circle cx="72" cy="335" r="4" fill="#ff6a1a"/>
  <text x="88" y="340" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2c2c2a">Name a behaviour in the diff that the tests do not cover. Propose the assertion in wo…</text>
  <text x="64" y="384" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0b0b0b">Secret scan</text>
  <circle cx="72" cy="411" r="4" fill="#ff6a1a"/>
  <text x="88" y="416" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2c2c2a">Use when: Before merge.</text>
  <circle cx="72" cy="439" r="4" fill="#ff6a1a"/>
  <text x="88" y="444" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2c2c2a">Point at anything that looks like a key, password, or connection string. Do not repea…</text>
  <text x="64" y="488" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0b0b0b">Failure path</text>
  <circle cx="72" cy="515" r="4" fill="#ff6a1a"/>
  <text x="88" y="520" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2c2c2a">Use when: The happy path works.</text>
  <circle cx="72" cy="543" r="4" fill="#ff6a1a"/>
  <text x="88" y="548" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2c2c2a">What happens when the input is empty, too large, or the downstream call throws? Answe…</text>
</svg>
