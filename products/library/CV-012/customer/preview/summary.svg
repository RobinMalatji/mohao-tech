  <text x="88" y="256" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2c2c2a">I close the month for independent cafes.</text>
  <circle cx="72" cy="279" r="4" fill="#ff6a1a"/>
  <text x="88" y="284" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2c2c2a">Last year I moved three of them from a shoebox of slips to a monthly export.</text>
  <circle cx="72" cy="307" r="4" fill="#ff6a1a"/>
  <text x="88" y="312" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2c2c2a">I am looking for two more cafes in Cape Town.</text>
  <text x="64" y="356" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0b0b0b">Skills to tailor</text>
  <circle cx="72" cy="383" r="4" fill="#ff6a1a"/>
  <text x="88" y="388" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2c2c2a">One reader</text>
  <circle cx="72" cy="411" r="4" fill="#ff6a1a"/>
