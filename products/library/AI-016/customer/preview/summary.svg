<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <rect width="1200" height="750" fill="#f4f3ef"/>
  <rect x="28" y="24" width="1144" height="702" rx="18" fill="#ffffff" stroke="#e6e4de"/>
  <text x="64" y="78" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#0b0b0b">Research briefing prompts</text>
  <text x="64" y="118" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#5f5e58">These prompts draft text for you to edit. They do not check facts, quotes, or</text>
  <text x="64" y="142" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#5f5e58">the law. Remove anything the model invented before you send it.</text>
  <text x="64" y="176" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0b0b0b">Source list</text>
  <circle cx="72" cy="203" r="4" fill="#ff6a1a"/>
  <text x="88" y="208" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2c2c2a">Use when: You pasted notes.</text>
  <circle cx="72" cy="231" r="4" fill="#ff6a1a"/>
  <text x="88" y="236" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2c2c2a">List the sources I actually pasted. Do not add famous studies from memory.</text>
  <text x="64" y="280" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0b0b0b">Claims</text>
  <circle cx="72" cy="307" r="4" fill="#ff6a1a"/>
  <text x="88" y="312" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2c2c2a">Use when: You need the findings.</text>
  <circle cx="72" cy="335" r="4" fill="#ff6a1a"/>
  <text x="88" y="340" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2c2c2a">List claims and the source for each. If two sources disagree, show both.</text>
  <text x="64" y="384" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0b0b0b">Not established</text>
  <circle cx="72" cy="411" r="4" fill="#ff6a1a"/>
  <text x="88" y="416" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2c2c2a">Use when: You are about to recommend.</text>
  <circle cx="72" cy="439" r="4" fill="#ff6a1a"/>
  <text x="88" y="444" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2c2c2a">Write what these sources do not establish.</text>
  <text x="64" y="488" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0b0b0b">Brief</text>
  <circle cx="72" cy="515" r="4" fill="#ff6a1a"/>
  <text x="88" y="520" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2c2c2a">Use when: You need one page.</text>
  <circle cx="72" cy="543" r="4" fill="#ff6a1a"/>
  <text x="88" y="548" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2c2c2a">Write a brief: question, what the sources say, what they do not say, what I might do…</text>
</svg>
