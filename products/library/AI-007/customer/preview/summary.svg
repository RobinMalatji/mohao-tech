<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <rect width="1200" height="750" fill="#f4f3ef"/>
  <rect x="28" y="24" width="1144" height="702" rx="18" fill="#ffffff" stroke="#e6e4de"/>
  <text x="64" y="78" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#0b0b0b">Requirement writing prompts</text>
  <text x="64" y="118" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#5f5e58">These prompts draft text for you to edit. They do not check facts, quotes, or</text>
  <text x="64" y="142" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#5f5e58">the law. Remove anything the model invented before you send it.</text>
  <text x="64" y="176" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0b0b0b">One sentence</text>
  <circle cx="72" cy="203" r="4" fill="#ff6a1a"/>
  <text x="88" y="208" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2c2c2a">Use when: The request is a paragraph.</text>
  <circle cx="72" cy="231" r="4" fill="#ff6a1a"/>
  <text x="88" y="236" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2c2c2a">Rewrite the request as: who, does what, so that. If the notes do not say why, write '…</text>
  <text x="64" y="280" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0b0b0b">Acceptance</text>
  <circle cx="72" cy="307" r="4" fill="#ff6a1a"/>
  <text x="88" y="312" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2c2c2a">Use when: You need a test.</text>
  <circle cx="72" cy="335" r="4" fill="#ff6a1a"/>
  <text x="88" y="340" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2c2c2a">Write acceptance checks a person can run without reading your mind. Use the inputs I…</text>
  <text x="64" y="384" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0b0b0b">Out of scope</text>
  <circle cx="72" cy="411" r="4" fill="#ff6a1a"/>
  <text x="88" y="416" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2c2c2a">Use when: The request is growing.</text>
  <circle cx="72" cy="439" r="4" fill="#ff6a1a"/>
  <text x="88" y="444" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2c2c2a">List three nearby ideas that this requirement does not include.</text>
  <text x="64" y="488" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0b0b0b">Edge cases</text>
  <circle cx="72" cy="515" r="4" fill="#ff6a1a"/>
  <text x="88" y="520" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2c2c2a">Use when: Before you build.</text>
  <circle cx="72" cy="543" r="4" fill="#ff6a1a"/>
  <text x="88" y="548" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2c2c2a">List empty, duplicate, and permission failures for this requirement. Mark any you can…</text>
</svg>
