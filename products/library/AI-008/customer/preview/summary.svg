<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <rect width="1200" height="750" fill="#f4f3ef"/>
  <rect x="28" y="24" width="1144" height="702" rx="18" fill="#ffffff" stroke="#e6e4de"/>
  <text x="64" y="78" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#0b0b0b">Local business captions</text>
  <text x="64" y="118" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#5f5e58">These prompts draft text for you to edit. They do not check facts, quotes, or</text>
  <text x="64" y="142" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#5f5e58">the law. Remove anything the model invented before you send it.</text>
  <text x="64" y="176" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0b0b0b">This week only</text>
  <circle cx="72" cy="203" r="4" fill="#ff6a1a"/>
  <text x="88" y="208" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2c2c2a">Use when: You have a dated offer.</text>
  <circle cx="72" cy="231" r="4" fill="#ff6a1a"/>
  <text x="88" y="236" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2c2c2a">Write three captions for the offer I paste. Include the date and the price I gave you…</text>
  <text x="64" y="280" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0b0b0b">Sold out</text>
  <circle cx="72" cy="307" r="4" fill="#ff6a1a"/>
  <text x="88" y="312" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2c2c2a">Use when: The item is gone.</text>
  <circle cx="72" cy="335" r="4" fill="#ff6a1a"/>
  <text x="88" y="340" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2c2c2a">Write a caption that says it is sold out and names when it returns only if I told you…</text>
  <text x="64" y="384" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0b0b0b">Hours</text>
  <circle cx="72" cy="411" r="4" fill="#ff6a1a"/>
  <text x="88" y="416" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2c2c2a">Use when: The hours changed.</text>
  <circle cx="72" cy="439" r="4" fill="#ff6a1a"/>
  <text x="88" y="444" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2c2c2a">Write one caption with the new hours and the old hours so people are not surprised. U…</text>
  <text x="64" y="488" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0b0b0b">Behind the counter</text>
  <circle cx="72" cy="515" r="4" fill="#ff6a1a"/>
  <text x="88" y="520" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2c2c2a">Use when: You want a process post.</text>
  <circle cx="72" cy="543" r="4" fill="#ff6a1a"/>
  <text x="88" y="548" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2c2c2a">Write a caption about the step I describe. Do not claim a certification or an award.</text>
</svg>
